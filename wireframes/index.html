<title>Okapi Logistics Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================ Tokens : 3 états de thème ============================ */
:root{
  --bg:#f4f4f7; --surface:#ffffff; --surface-2:#fbfbfd;
  --ink:#23222c; --ink-mute:#6a6976; --line:#d9d9e1;
  --wf-fill:#ececf1; --wf-fill-2:#d3d3dd; --wf-ink:#9a99a6;
  --chrome:#170655; --chrome-ink:#eae7ff; --chrome-line:#2a1d6b;
  --accent:#e47911; --accent-ink:#ffffff; --accent-soft:#fbe7d1;
  --link:#1592ad;
  --ok:#1f9d57; --ok-soft:#dcf1e5;
  --warn:#c07700; --warn-soft:#f7ead2;
  --err:#c0392b; --err-soft:#f6dcd9;
  --shadow:0 1px 2px rgba(20,10,60,.06), 0 12px 32px rgba(20,10,60,.10);
  --radius:8px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141420; --surface:#1e1d2a; --surface-2:#24222f;
    --ink:#e9e8f0; --ink-mute:#a5a3b4; --line:#343343;
    --wf-fill:#2b2a39; --wf-fill-2:#3c3a4d; --wf-ink:#7f7d90;
    --chrome:#1c0c58; --chrome-ink:#e7e3ff; --chrome-line:#372a86;
    --accent:#f0872a; --accent-ink:#1a1206; --accent-soft:#3a2a14;
    --link:#54c4dd;
    --ok:#3fbd77; --ok-soft:#173a29;
    --warn:#d9973a; --warn-soft:#3a2f16;
    --err:#e0685c; --err-soft:#3c1f1c;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#141420; --surface:#1e1d2a; --surface-2:#24222f;
  --ink:#e9e8f0; --ink-mute:#a5a3b4; --line:#343343;
  --wf-fill:#2b2a39; --wf-fill-2:#3c3a4d; --wf-ink:#7f7d90;
  --chrome:#1c0c58; --chrome-ink:#e7e3ff; --chrome-line:#372a86;
  --accent:#f0872a; --accent-ink:#1a1206; --accent-soft:#3a2a14;
  --link:#54c4dd;
  --ok:#3fbd77; --ok-soft:#173a29;
  --warn:#d9973a; --warn-soft:#3a2f16;
  --err:#e0685c; --err-soft:#3c1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit}
a{color:var(--link)}

/* ============================ Ossature du visualiseur ============================ */
.app{display:grid; grid-template-columns:264px 1fr; grid-template-rows:auto 1fr; height:100%;
  grid-template-areas:"head head" "rail canvas";}
.vhead{grid-area:head; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:10px 18px; background:var(--surface); border-bottom:1px solid var(--line);}
.vtitle{font-weight:600; letter-spacing:.01em; white-space:nowrap}
.vtitle b{color:var(--accent)}
.crumb{display:flex; align-items:center; gap:8px; min-width:0}
.sid{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; font-size:12px;
  font-weight:600; background:var(--accent-soft); color:var(--accent); padding:2px 7px; border-radius:5px;
  border:1px solid color-mix(in srgb, var(--accent) 30%, transparent); white-space:nowrap}
.crumb .txt{color:var(--ink-mute); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nav-arrows{display:flex; gap:4px}
.nav-arrows button{width:30px; height:30px; border-radius:6px; border:1px solid var(--line);
  background:var(--surface-2); cursor:pointer; display:grid; place-items:center}
.nav-arrows button:hover{border-color:var(--accent); color:var(--accent)}
.vhead .spacer{flex:1 1 40px}
.flowpick{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-mute)}
.flowpick select{font:inherit; font-size:12.5px; padding:5px 8px; border-radius:6px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink); max-width:230px}
.flowstep{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--link)}
.toggles{display:flex; gap:6px}
.toggles button{border:1px solid var(--line); background:var(--surface-2); border-radius:6px;
  padding:6px 10px; font-size:12.5px; cursor:pointer; display:flex; gap:6px; align-items:center}
.toggles button[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}

.rail{grid-area:rail; overflow:auto; background:var(--surface); border-right:1px solid var(--line); padding:12px 10px}
.railGroup{margin-bottom:14px}
.railGroup h2{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-mute);
  margin:6px 8px 6px; font-weight:600}
.railItem{display:flex; gap:9px; align-items:baseline; width:100%; text-align:left; cursor:pointer;
  background:none; border:0; padding:6px 9px; border-radius:6px; color:var(--ink); line-height:1.35}
.railItem:hover{background:var(--surface-2)}
.railItem.active{background:var(--accent-soft); color:var(--accent)}
.railItem .k{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-mute); flex:none; width:74px}
.railItem.active .k{color:var(--accent)}
.railItem .t{font-size:12.5px}
.railSelect{display:none}

.canvas{grid-area:canvas; overflow:auto; padding:26px; display:flex; justify-content:center}
.frame{width:100%; max-width:1080px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; align-self:flex-start}
.frame.narrow{max-width:560px}
.frame.sheet{max-width:640px}

.notes{position:fixed; top:0; right:0; height:100%; width:340px; background:var(--surface);
  border-left:1px solid var(--line); box-shadow:var(--shadow); transform:translateX(100%);
  transition:transform .18s ease; z-index:40; display:flex; flex-direction:column}
.notes.open{transform:none}
.notes h3{margin:0; padding:16px 18px; border-bottom:1px solid var(--line); font-size:13px;
  letter-spacing:.02em; display:flex; justify-content:space-between; align-items:center}
.notes h3 button{border:0; background:none; cursor:pointer; font-size:18px; color:var(--ink-mute); line-height:1}
.notes ul{margin:0; padding:14px 18px 24px; list-style:none; display:flex; flex-direction:column; gap:12px; overflow:auto}
.notes li{font-size:12.5px; color:var(--ink); padding-left:14px; position:relative}
.notes li::before{content:""; position:absolute; left:0; top:7px; width:5px; height:5px; border-radius:50%; background:var(--link)}
.notes code{font-family:"IBM Plex Mono",monospace; font-size:11.5px; background:var(--wf-fill);
  padding:1px 5px; border-radius:4px; color:var(--ink-mute)}

@media (prefers-reduced-motion:reduce){.notes{transition:none}}

/* ============================ Primitives de wireframe ============================ */
.wf-chrome,.wf-pubframe,.wf-authframe,.wf-docframe{font-size:13px}
.wf-bar{display:flex; align-items:center; gap:12px; background:var(--chrome); color:var(--chrome-ink);
  padding:9px 14px; border-bottom:1px solid var(--chrome-line)}
.wf-brand{font-weight:600; letter-spacing:.02em; white-space:nowrap}
.wf-omnisearch{flex:1; max-width:320px; background:color-mix(in srgb,var(--chrome-ink) 14%, transparent);
  border:1px solid var(--chrome-line); border-radius:6px; padding:6px 10px; color:var(--chrome-ink);
  font-size:12px; opacity:.9}
.wf-baruser{margin-left:auto; display:flex; align-items:center; gap:6px}
.wf-tag{font-size:11px; border:1px solid var(--chrome-line); border-radius:5px; padding:2px 6px; opacity:.85}
.wf-avatar{width:26px; height:26px; border-radius:50%; background:color-mix(in srgb,var(--chrome-ink) 22%, transparent);
  display:grid; place-items:center; font-size:11px; font-weight:600}
.wf-split{display:grid; grid-template-columns:212px 1fr}
.wf-rail{background:var(--surface-2); border-right:1px solid var(--line); padding:10px 8px; display:flex; flex-direction:column; gap:2px}
.wf-nav{display:block; text-align:left; background:none; border:0; border-radius:6px; padding:7px 10px;
  font-size:12.5px; color:var(--ink); cursor:pointer}
.wf-nav:hover{background:var(--wf-fill)}
.wf-nav.active{background:var(--chrome); color:var(--chrome-ink)}
.wf-railsep{font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-mute); margin:12px 10px 4px}
.wf-canvas-main{padding:20px 22px; min-height:520px; display:flex; flex-direction:column; gap:16px}

.wf-pagehead{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.wf-pagehead h1{font-size:16px; margin:0; font-weight:600}
.wf-pagehead .wf-spacer{flex:1}

.wf-h{background:var(--wf-fill-2); border-radius:4px; height:16px; margin:2px 0}
.wf-line{display:block; background:var(--wf-fill); border-radius:3px; height:10px}
.wf-line.sm{height:8px} .wf-line.tall{height:13px}
.wf-textblock{display:flex; flex-direction:column; gap:6px}

.wf-block{background:var(--wf-fill); border:1px dashed var(--line); border-radius:6px;
  display:grid; place-items:center; color:var(--wf-ink); font-family:"IBM Plex Mono",monospace;
  font-size:11px; text-align:center; padding:8px}

.wf-card{border:1px solid var(--line); border-radius:8px; padding:14px; background:var(--surface); display:flex; flex-direction:column; gap:10px}
.wf-card.plain{background:var(--surface-2)}
.wf-cardtitle{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-mute); font-weight:600}

.wf-grid{display:grid; gap:14px}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}

.wf-field{display:flex; flex-direction:column; gap:5px}
.wf-field>span:first-child{font-size:11px; color:var(--ink-mute)}
.wf-input{border:1px solid var(--line); border-radius:6px; background:var(--surface-2); padding:7px 9px;
  font-size:12px; color:var(--ink-mute); min-height:31px; display:flex; align-items:center}
.wf-input.select::after{content:"▾"; margin-left:auto; color:var(--wf-ink)}

.wf-btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface-2);
  color:var(--ink); border-radius:999px; padding:6px 13px; font-size:12px; font-family:"IBM Plex Mono",monospace; cursor:default}
.wf-btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.wf-btnrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

.wf-tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); padding-bottom:0}
.wf-tab{padding:7px 12px; font-size:12px; border:1px solid transparent; border-bottom:0; border-radius:7px 7px 0 0; color:var(--ink-mute); cursor:pointer}
.wf-tab.active{background:var(--surface); border-color:var(--line); color:var(--ink); font-weight:600; margin-bottom:-1px}

.wf-table{border:1px solid var(--line); border-radius:8px; overflow:hidden}
.wf-tr{display:grid; grid-template-columns:var(--cols,repeat(6,1fr)); gap:10px; padding:9px 12px; align-items:center; font-size:12px}
.wf-tr+.wf-tr{border-top:1px solid var(--line)}
.wf-tr.wf-th{background:var(--surface-2); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-mute); font-weight:600}
.wf-tr span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.wf-mono{font-family:"IBM Plex Mono",monospace; font-size:11.5px}

.wf-pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px;
  border:1px solid var(--line); color:var(--ink-mute); background:var(--surface-2)}
.wf-pill.ok{background:var(--ok-soft); color:var(--ok); border-color:transparent}
.wf-pill.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.wf-pill.err{background:var(--err-soft); color:var(--err); border-color:transparent}
.wf-pill.info{background:color-mix(in srgb,var(--link) 16%, transparent); color:var(--link); border-color:transparent}

.wf-kpi{border:1px solid var(--line); border-radius:8px; padding:12px 14px; display:flex; flex-direction:column; gap:8px}
.wf-kpi .lab{font-size:11px; color:var(--ink-mute)}
.wf-kpi .num{height:22px; width:60%; background:var(--wf-fill-2); border-radius:4px}
.wf-kpi.alert{border-color:color-mix(in srgb,var(--err) 45%, var(--line))}

.wf-note{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-mute);
  border-left:2px solid var(--link); padding:6px 0 6px 10px; margin:0; background:linear-gradient(90deg,color-mix(in srgb,var(--link) 8%, transparent),transparent)}

.wf-stepper{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-mute); font-family:"IBM Plex Mono",monospace}
.wf-stepper i{width:20px; height:20px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font-style:normal}
.wf-stepper i.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.wf-stepper .bar{width:26px; height:1px; background:var(--line)}

.wf-flow{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11px; color:var(--ink-mute); font-family:"IBM Plex Mono",monospace}
.wf-flow i{width:12px; height:12px; border-radius:50%; border:2px solid var(--line); display:inline-block; font-style:normal}
.wf-flow i.done{background:var(--link); border-color:var(--link)}
.wf-flow .seg{width:22px; height:2px; background:var(--line)}

.wf-radio{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-mute)}
.wf-radio i{width:13px; height:13px; border-radius:50%; border:1px solid var(--wf-ink); display:inline-block; flex:none}
.wf-radio i.on{border-color:var(--accent); box-shadow:inset 0 0 0 3px var(--accent)}
.wf-check{display:flex; align-items:flex-start; gap:8px; font-size:12px; color:var(--ink-mute)}
.wf-check i{width:14px; height:14px; border-radius:3px; border:1px solid var(--wf-ink); flex:none; margin-top:1px}
.wf-check i.on{background:var(--accent); border-color:var(--accent)}

/* Cadres non back-office */
.wf-pubframe{background:var(--surface)}
.wf-pubbar{display:flex; align-items:center; gap:10px; padding:12px 18px; border-bottom:1px solid var(--line)}
.wf-pubbar .wf-brand{color:var(--chrome)}
.wf-pubbar .wf-tag{color:var(--ink-mute)}
.wf-pubmain{padding:34px 30px; display:flex; flex-direction:column; gap:18px; align-items:center; text-align:center}
.wf-pubmain .inner{width:100%; max-width:420px; display:flex; flex-direction:column; gap:16px; text-align:left}
.wf-pubfoot{border-top:1px solid var(--line); padding:14px 18px; font-size:11px; color:var(--ink-mute); text-align:center}

.wf-authframe{padding:34px; display:flex; justify-content:center; background:var(--surface-2)}
.wf-authcard{width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:24px; display:flex; flex-direction:column; gap:14px}
.wf-authcard .logo{width:34px; height:34px; border-radius:8px; background:var(--chrome)}

.wf-docframe{padding:26px; background:var(--surface-2); display:flex; justify-content:center}
.wf-sheet{background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:3px;
  padding:22px; width:100%; max-width:420px; display:flex; flex-direction:column; gap:12px; font-size:12px}
.wf-sheet .rowline{display:flex; justify-content:space-between; gap:10px; color:var(--ink-mute)}
.wf-sheet .hr{height:1px; background:var(--line); margin:4px 0}

/* Zones cliquables */
[data-goto]{cursor:pointer; transition:outline-color .1s, background-color .1s}
[data-goto]:hover{outline:2px solid var(--accent); outline-offset:2px; background:var(--accent-soft)}
.wf-tr[data-goto]:hover,.wf-nav[data-goto]:hover{background:var(--accent-soft)}
body.show-hot [data-goto]{outline:1.5px dashed color-mix(in srgb,var(--accent) 70%, transparent); outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  body.show-hot [data-goto]{animation:wfp 2s ease-in-out infinite}
  @keyframes wfp{0%,100%{outline-color:color-mix(in srgb,var(--accent) 30%, transparent)}50%{outline-color:var(--accent)}}
}

.hint{max-width:1080px; margin:0 auto 14px; font-size:11.5px; color:var(--ink-mute); display:flex; gap:14px; flex-wrap:wrap}
.hint b{color:var(--ink)}

@media (max-width:900px){
  .app{grid-template-columns:1fr; grid-template-rows:auto auto 1fr; grid-template-areas:"head" "nav" "canvas"}
  .rail{display:none}
  .railSelect{display:block; grid-area:nav; margin:8px 14px; padding:8px 10px; font:inherit;
    border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--ink)}
  .vhead{gap:10px}
  .vtitle{font-size:13px}
  .wf-split{grid-template-columns:1fr}
  .wf-rail{flex-direction:row; overflow:auto; border-right:0; border-bottom:1px solid var(--line)}
  .wf-railsep{display:none}
  .cols-4{grid-template-columns:repeat(2,1fr)}
  .cols-3{grid-template-columns:1fr}
  .notes{width:100%}
}
</style>

<div class="app">
  <header class="vhead">
    <span class="vtitle">Okapi <b>Logistics</b> · Maquettes</span>
    <div class="nav-arrows">
      <button id="prev" title="Écran précédent ( [ )">‹</button>
      <button id="next" title="Écran suivant ( ] )">›</button>
    </div>
    <div class="crumb"><span class="sid" id="sid">W-AUTH-01</span><span class="txt" id="crumb">Authentification / Connexion</span></div>
    <span class="spacer"></span>
    <label class="flowpick">Parcours
      <select id="flow">
        <option value="">— libre —</option>
      </select>
      <span class="flowstep" id="flowstep"></span>
    </label>
    <div class="toggles">
      <button id="hot" aria-pressed="false" title="Surligner les zones cliquables ( h )">◹ Zones cliquables</button>
      <button id="notesBtn" aria-pressed="false" title="Notes &amp; règles de l'écran">✎ Notes</button>
      <button id="theme" title="Thème clair / sombre">◐ Thème</button>
    </div>
  </header>
  <select class="railSelect" id="railSelect" aria-label="Choisir un écran"></select>
  <nav class="rail" id="rail"></nav>
  <main class="canvas" id="canvas"></main>
</div>

<aside class="notes" id="notes" aria-live="polite">
  <h3><span>Notes &amp; règles — <span id="notesId">W-AUTH-01</span></span><button id="notesClose" aria-label="Fermer">×</button></h3>
  <ul id="notesList"></ul>
</aside>

<script>
(function(){
"use strict";

/* ------------------------------- helpers de rendu ------------------------------- */
var E=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
function L(w){return '<span class="wf-line" style="width:'+(w||'100%')+'"></span>';}
function LINES(arr){return '<div class="wf-textblock">'+arr.map(function(w){return L(w);}).join('')+'</div>';}
function H(t,w){return '<div class="wf-pagehead"><h1>'+E(t)+'</h1>'+(w||'')+'</div>';}
function F(label,val,goto){return '<label class="wf-field"><span>'+E(label)+'</span><span class="wf-input'+(/(▾)/.test(val||'')?' select':'')+'"'+(goto?' data-goto="'+goto+'"':'')+'>'+E(val||'')+'</span></label>';}
function B(t,o){o=o||{};return '<button class="wf-btn'+(o.primary?' primary':'')+'"'+(o.goto?' data-goto="'+o.goto+'"':'')+(o.goto?'':' title="(maquette)"')+'>'+E(t)+'</button>';}
function PILL(t,k){return '<span class="wf-pill '+(k||'')+'">'+E(t)+'</span>';}
function BLOCK(t,h){return '<div class="wf-block" style="min-height:'+(h||120)+'px">'+E(t||'')+'</div>';}
function NOTE(t){return '<p class="wf-note">'+t+'</p>';}
function CARD(title,body,plain){return '<div class="wf-card'+(plain?' plain':'')+'">'+(title?'<div class="wf-cardtitle">'+E(title)+'</div>':'')+body+'</div>';}
function KPI(lab,alert){return '<div class="wf-kpi'+(alert?' alert':'')+'"><span class="lab">'+E(lab)+'</span><span class="num"></span></div>';}
function RADIO(label,on){return '<span class="wf-radio"><i class="'+(on?'on':'')+'"></i>'+E(label)+'</span>';}
function CHECK(label,on){return '<span class="wf-check"><i class="'+(on?'on':'')+'"></i><span>'+E(label)+'</span></span>';}
function TABLE(cols,head,rows){
  var c='--cols:'+cols+';';
  var h='<div class="wf-tr wf-th" style="'+c+'">'+head.map(function(x){return '<span>'+E(x)+'</span>';}).join('')+'</div>';
  var b=rows.map(function(r){
    return '<div class="wf-tr" style="'+c+'"'+(r.goto?' data-goto="'+r.goto+'"':'')+'>'+
      r.cells.map(function(x){return '<span>'+x+'</span>';}).join('')+'</div>';
  }).join('');
  return '<div class="wf-table">'+h+b+'</div>';
}
function STEP(n){

/* --------------------------------- routage & UI --------------------------------- */
var GROUPS=['Authentification','Agent fret','Administration / DAF','Super-admin / Configuration','Client (public)','Documents'];
var ORDER=Object.keys(S).sort(function(a,b){
  if(S[a].g!==S[b].g) return S[a].g-S[b].g;
  return a<b?-1:1;
});
var FLOWS={
  enr:{label:"Enregistrement d’un colis",steps:['W-AGT-01','W-AGT-02','W-AGT-03','W-AGT-04','W-AGT-05']},
  pay:{label:"Encaissement d’un paiement",steps:['W-AGT-08','W-AGT-09','W-AGT-11']},
  suivi:{label:"Suivi par le client",steps:['W-PUB-01','W-PUB-02','W-PUB-03']},
  cfg:{label:"Configuration & tarifs",steps:['W-SAD-03','W-SAD-04','W-ADM-04','W-ADM-05']}
};

var canvas=document.getElementById('canvas');
var railEl=document.getElementById('rail');
var railSel=document.getElementById('railSelect');
var sidEl=document.getElementById('sid');
var crumbEl=document.getElementById('crumb');
var notesEl=document.getElementById('notes');
var notesList=document.getElementById('notesList');
var notesId=document.getElementById('notesId');
var flowSel=document.getElementById('flow');
var flowStep=document.getElementById('flowstep');
var LS=window.localStorage;

/* rail */
(function buildRail(){
  var html='';
  GROUPS.forEach(function(name,gi){
    html+='<div class="railGroup"><h2>'+E(name)+'</h2>';
    ORDER.filter(function(id){return S[id].g===gi;}).forEach(function(id){
      html+='<button class="railItem" data-goto="'+id+'"><span class="k">'+id+'</span><span class="t">'+E(S[id].t)+'</span></button>';
    });
    html+='</div>';
  });
  railEl.innerHTML=html;
  var opt='';
  GROUPS.forEach(function(name,gi){
    opt+='<optgroup label="'+E(name)+'">';
    ORDER.filter(function(id){return S[id].g===gi;}).forEach(function(id){
      opt+='<option value="'+id+'">'+id+' — '+E(S[id].t)+'</option>';
    });
    opt+='</optgroup>';
  });
  railSel.innerHTML=opt;
})();

Object.keys(FLOWS).forEach(function(k){
  var o=document.createElement('option'); o.value=k; o.textContent=FLOWS[k].label; flowSel.appendChild(o);
});

function currentFlow(){return FLOWS[flowSel.value]||null;}

function render(id){
  if(!S[id]) id=ORDER[0];
  var sc=S[id];
  canvas.innerHTML='<div><div class="hint"><span><b>'+id+'</b> — '+E(sc.t)+'</span>'+
    '<span>Cliquez les éléments <b style="color:var(--accent)">orange au survol</b> pour naviguer.</span>'+
    '<span>Raccourcis : <b>[</b> <b>]</b> écrans · <b>h</b> zones cliquables</span></div>'+
    '<div class="frame '+(sc.w||'')+'">'+sc.html+'</div></div>';
  sidEl.textContent=id;
  crumbEl.textContent=sc.crumb||sc.t;
  notesId.textContent=id;
  notesList.innerHTML=(sc.notes||['(pas de note pour cet écran)']).map(function(n){return '<li>'+n+'</li>';}).join('');
  Array.prototype.forEach.call(railEl.querySelectorAll('.railItem'),function(b){
    b.classList.toggle('active',b.getAttribute('data-goto')===id);
  });
  railSel.value=id;
  var f=currentFlow();
  if(f){
    var i=f.steps.indexOf(id);
    flowStep.textContent=i>=0?('Étape '+(i+1)+'/'+f.steps.length):('hors parcours');
  } else flowStep.textContent='';
  try{LS.setItem('okapi.screen',id);}catch(e){}
  canvas.scrollTop=0;
}

function go(id){ if(S[id]) location.hash=id; }

function step(dir){
  var cur=(location.hash||'').replace('#','')||ORDER[0];
  var f=currentFlow();
  var list=f?f.steps:ORDER;
  var i=list.indexOf(cur);
  if(i<0){ i=ORDER.indexOf(cur); list=ORDER; }
  var n=list[(i+dir+list.length)%list.length];
  go(n);
}

/* délégation des clics sur toute zone [data-goto] */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-goto]');
  if(!t) return;
  ev.preventDefault();
  go(t.getAttribute('data-goto'));
});
railSel.addEventListener('change',function(){go(railSel.value);});
document.getElementById('prev').addEventListener('click',function(){step(-1);});
document.getElementById('next').addEventListener('click',function(){step(1);});
flowSel.addEventListener('change',function(){
  try{LS.setItem('okapi.flow',flowSel.value);}catch(e){}
  var f=currentFlow(); if(f) go(f.steps[0]); else render((location.hash||'').replace('#',''));
});

/* toggles */
var hotBtn=document.getElementById('hot');
function setHot(on){ document.body.classList.toggle('show-hot',on); hotBtn.setAttribute('aria-pressed',on?'true':'false'); try{LS.setItem('okapi.hot',on?'1':'0');}catch(e){} }
hotBtn.addEventListener('click',function(){ setHot(!document.body.classList.contains('show-hot')); });

var notesBtn=document.getElementById('notesBtn');
function setNotes(on){ notesEl.classList.toggle('open',on); notesBtn.setAttribute('aria-pressed',on?'true':'false'); try{LS.setItem('okapi.notes',on?'1':'0');}catch(e){} }
notesBtn.addEventListener('click',function(){ setNotes(!notesEl.classList.contains('open')); });
document.getElementById('notesClose').addEventListener('click',function(){ setNotes(false); });

var themeBtn=document.getElementById('theme');
themeBtn.addEventListener('click',function(){
  var cur=document.documentElement.getAttribute('data-theme');
  var next=cur==='dark'?'light':(cur==='light'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark'));
  document.documentElement.setAttribute('data-theme',next);
  try{LS.setItem('okapi.theme',next);}catch(e){}
});

document.addEventListener('keydown',function(ev){
  if(ev.target.matches('input,textarea,select')) return;
  if(ev.key===']') step(1);
  else if(ev.key==='[') step(-1);
  else if(ev.key==='h'||ev.key==='H') setHot(!document.body.classList.contains('show-hot'));
});

window.addEventListener('hashchange',function(){ render((location.hash||'').replace('#','')); });

/* état initial */
(function init(){
  try{
    var th=LS.getItem('okapi.theme'); if(th) document.documentElement.setAttribute('data-theme',th);
    if(LS.getItem('okapi.hot')==='1') setHot(true);
    if(LS.getItem('okapi.notes')==='1') setNotes(true);
    var fl=LS.getItem('okapi.flow'); if(fl&&FLOWS[fl]) flowSel.value=fl;
  }catch(e){}
  var start=(location.hash||'').replace('#','');
  if(!S[start]){ try{start=LS.getItem('okapi.screen');}catch(e){} }
  if(!S[start]) start=ORDER[0];
  if(location.hash.replace('#','')===start) render(start); else location.hash=start;
})();
})();
</script>
